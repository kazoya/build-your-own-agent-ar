<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تواصل عبر واتساب</title>
  <style>
    body { font-family: "Segoe UI", Tahoma, sans-serif; margin: 0; background: #fafaf9; color: #1c1917; }
    main { max-width: 36rem; margin: 4rem auto; padding: 0 1.25rem; }
    a { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.1rem; background: #128C7E; color: #fff; text-decoration: none; border-radius: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>مرحباً</h1>
    <p>اكتب طلبك في واتساب. نرد خلال ساعات العمل.</p>
    <a id="wa" href="#">افتح واتساب</a>
  </main>
  <script>
    const phone = "YOUR_NUMBER";
    const text = "السلام عليكم، أود الاستفسار بخصوص ";
    const link = document.querySelector("#wa");
    link.href = "https://wa.me/" + phone + "?text=" + encodeURIComponent(text);
  </script>
</body>
</html>
